name: moodle-subplugin-ci-client

# CI for catquizcentralhub_client, run from this plugin's own repository.
#
# The plugin is a subplugin of local_catquiz and installs under
# local/catquiz/catquizcentralhub/client. The parent plugin is therefore installed
# first, as a dependency - testing the subplugin without it would test something that
# exists in no installation.
#
# One detail decides whether this works at all: local_catquiz attaches both hub
# plugins as git submodules, so a plain clone of it leaves
# catquizcentralhub/host and catquizcentralhub/client behind as EMPTY directories.
# moodle-plugin-ci refuses to install into an existing directory - it checks
# is_dir(), not whether a plugin is actually there - and aborts with "Plugin is
# already installed in standard Moodle". The placeholder is removed below before the
# real plugin is installed.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOODLE_BRANCH: MOODLE_405_STABLE
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  client:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mbstring, sodium, zip, gd, xmlrpc, soap, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin && pwd)" >> $GITHUB_PATH

          # Moodle's PHPUnit bootstrap refuses to run without en_AU.UTF-8, which the
          # runner image does not ship. Without this the init step aborts with
          # "Required locale 'en_AU.UTF-8' is not installed" - and the message reads
          # like a missing language pack rather than a missing system locale.
          # The parent plugin's workflow does the same thing at the same point.
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle and the parent plugin
        run: |
          # The parent plugin and its own hard dependencies. The subplugin under test
          # is NOT added here - it is installed from this checkout below.
          moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-local_wunderbyte_table
          moodle-plugin-ci add-plugin --branch v-3.0 ralferlebach/moodle-mod_adaptivequiz
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch v-3.0 ralferlebach/moodle-adaptivequizcatmodel_catquiz
          # The parent is pinned in version.php to the version on main, so main is
          # what is fetched here. The two have to be raised together: a pin ahead of
          # main makes these plugins uninstallable, and the install step then fails
          # with a dependency error - which is the pin working, not a workflow defect.
          moodle-plugin-ci add-plugin --branch main ralferlebach/moodle-local_catquiz

          # add-plugin only stages the plugins; install copies them into the tree.
          # The parent's clone brings the empty submodule directories with it, and
          # install refuses to write into a directory that already exists. Removing
          # the placeholders is what makes this workflow run at all.
          for placeholder in $(find . -type d -path '*catquizcentralhub/*' -empty); do
            echo "leerer Submodul-Platzhalter entfernt: $placeholder"
            rm -rf "$placeholder"
          done

          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init
        env:
          DB: pgsql

      - name: Verify the plugin was installed, not the placeholder
        run: |
          # The empty submodule directory of local_catquiz would make every check
          # below pass by having nothing to examine, which is indistinguishable from
          # passing for the right reason.
          target=$(find moodle -type d -path '*catquizcentralhub/client' | head -1)
          if [ -z "$target" ] || [ ! -f "$target/version.php" ]; then
            echo "catquizcentralhub_client wurde nicht installiert: $target"
            find moodle -type d -name catquizcentralhub
            exit 1
          fi
          echo "installiert unter: $target"
          echo "PLUGIN_PATH=$target" >> $GITHUB_ENV

      - name: PHP lint
        run: moodle-plugin-ci phplint "$PLUGIN_PATH"

      - name: Coding style
        run: moodle-plugin-ci phpcs "$PLUGIN_PATH"

      - name: Mustache templates
        run: moodle-plugin-ci mustache "$PLUGIN_PATH"

      - name: Initialise the test environment
        run: |
          cd moodle
          php -d max_input_vars=5000 admin/tool/phpunit/cli/init.php --no-composer-self-update

      - name: PHPUnit
        run: |
          # A run that matches no files exits zero and reports an empty suite as a
          # success, so the presence of tests is checked first.
          count=$(find "$PLUGIN_PATH" -name '*_test.php' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "Keine Testdateien - eine leere Suite meldet faelschlich Erfolg."
            exit 1
          fi
          echo "$count Testdateien"
          moodle-plugin-ci phpunit "$PLUGIN_PATH"
